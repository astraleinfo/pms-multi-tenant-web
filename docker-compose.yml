# docker compose up -d --build
#
# .env needs: NEXT_PUBLIC_APP_DOMAIN (e.g. pms.astraleinfo.com)
# Optional:   PMS_WEB_PORT (default 13000)

services:
  web:
    build:
      context: .
    image: pms-web:latest
    ports:
      - "0.0.0.0:3001:3000"
    restart: unless-stopped
    networks: [pms-internal]

networks:
  pms-internal:
    external: true
    name: pms-multi-tenant-api_default

